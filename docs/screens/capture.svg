<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <clipPath id="fc"><rect x="0" y="0" width="390" height="844" rx="40"/></clipPath>
    <linearGradient id="calm" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f3ede4"/><stop offset="1" stop-color="#e9eee7"/>
    </linearGradient>
    <radialGradient id="micg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3a2742"/><stop offset="1" stop-color="#241629"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#fc)">
    <rect width="390" height="844" fill="#f6f4ef"/>

    <!-- Header -->
    <text x="22" y="44" fill="#7fa68c" font-size="11.5" font-weight="600" letter-spacing="1.7">AMBIENT VISIT NOTES</text>
    <text x="22" y="76" fill="#2c2033" font-size="29" font-weight="600" font-family="Fraunces, Georgia, serif">Record</text>

    <!-- Calm gradient body -->
    <rect x="0" y="92" width="390" height="684" fill="url(#calm)"/>

    <text x="195" y="266" fill="#2c2033" font-size="26" font-weight="600" font-family="Fraunces, Georgia, serif" text-anchor="middle">Capture this visit</text>
    <text x="195" y="300" fill="#6a5c6e" font-size="15" text-anchor="middle">
      <tspan x="195" dy="0">With your consent, AI-Scribe listens and turns</tspan>
      <tspan x="195" dy="21">the visit into plain language you can keep.</tspan>
    </text>

    <!-- Breathing rings + mic (recording state) -->
    <circle cx="195" cy="470" r="94" fill="none" stroke="#e8927c" stroke-opacity="0.35"/>
    <circle cx="195" cy="470" r="76" fill="none" stroke="#e8927c" stroke-opacity="0.3"/>
    <circle cx="195" cy="470" r="59" fill="url(#micg)"/>
    <rect x="181" y="456" width="28" height="28" rx="7" fill="#fff"/>

    <text x="195" y="576" fill="#6a5c6e" font-size="14" text-anchor="middle">Listening… tap to stop.</text>

    <!-- live transcript preview -->
    <rect x="30" y="602" width="330" height="98" rx="14" fill="#fffefb" stroke="#e2d9cd"/>
    <text x="46" y="630" fill="#2c2033" font-size="14">
      <tspan x="46" dy="0">"…your biopsy results are back, and the</tspan>
      <tspan x="46" dy="20">next step is to see the surgeon, so please</tspan>
      <tspan x="46" dy="20">call the surgery office this week to</tspan>
      <tspan x="46" dy="20">schedule…"</tspan>
    </text>

    <!-- Footer nav -->
    <rect x="0" y="776" width="390" height="68" fill="#fffefb"/>
    <line x1="0" y1="776" x2="390" y2="776" stroke="#ece5db"/>
    <path d="M50 802 l12 -10 l12 10 v13 a1 1 0 0 1 -1 1 h-6 v-9 h-10 v9 h-6 a1 1 0 0 1 -1 -1 z" fill="none" stroke="#9b8f9e" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="62" y="832" fill="#9b8f9e" font-size="11" text-anchor="middle">Record</text>
    <circle cx="195" cy="800" r="15" fill="#e6efe7"/>
    <rect x="189" y="791" width="12" height="17" rx="6" fill="none" stroke="#3a2742" stroke-width="1.8"/>
    <path d="M183 802 a12 12 0 0 0 24 0 M195 810 v5" stroke="#3a2742" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="195" y="832" fill="#3a2742" font-size="11" font-weight="600" text-anchor="middle">Capture</text>
    <path d="M314 792 h18 a4 4 0 0 1 4 4 v11 a4 4 0 0 1 -4 4 h-13 l-5 5 v-5 a4 4 0 0 1 -4 -4 v-11 a4 4 0 0 1 4 -4 z" fill="none" stroke="#9b8f9e" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="326" y="832" fill="#9b8f9e" font-size="11" text-anchor="middle">Ask</text>
  </g>
  <rect x="0.5" y="0.5" width="389" height="843" rx="40" fill="none" stroke="#e2d9cd"/>
</svg>
