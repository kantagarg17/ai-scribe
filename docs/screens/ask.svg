<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <clipPath id="frame3"><rect x="0" y="0" width="390" height="844" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#frame3)">
    <rect width="390" height="844" fill="#faf6f1"/>

    <!-- Header -->
    <text x="24" y="52" fill="#8a7c8d" font-size="12" font-weight="600" letter-spacing="1.6">PERFECT MEMORY</text>
    <text x="24" y="90" fill="#2b1830" font-size="30" font-weight="600" font-family="Fraunces, Georgia, serif">Ask</text>

    <!-- user bubble -->
    <rect x="150" y="120" width="216" height="46" rx="18" fill="#2b1830"/>
    <rect x="356" y="152" width="10" height="14" fill="#2b1830"/>
    <text x="170" y="148" fill="#fff" font-size="15">Can you explain my ultrasound</text>
    <text x="170" y="158" fill="#fff" font-size="15"></text>

    <!-- assistant bubble -->
    <rect x="24" y="182" width="342" height="288" rx="18" fill="#fffdfb" stroke="#ece2d8"/>
    <rect x="24" y="456" width="10" height="14" fill="#fffdfb"/>
    <text x="44" y="212" fill="#2b1830" font-size="15">
      <tspan x="44" dy="0">From your ultrasound report on September 10,</tspan>
      <tspan x="44" dy="21">it found a small, irregular-shaped area in your</tspan>
      <tspan x="44" dy="21">right breast that looked different from the rest</tspan>
      <tspan x="44" dy="21">of the tissue. It was about 1.8 cm and located</tspan>
      <tspan x="44" dy="21">near the top of the breast, about 4 cm from the</tspan>
      <tspan x="44" dy="21">nipple. The edges weren't clear, which can be a</tspan>
      <tspan x="44" dy="21">sign something might be wrong.</tspan>
      <tspan x="44" dy="28">It was given a score of BI-RADS 4, which means</tspan>
      <tspan x="44" dy="21">it looked suspicious enough that a biopsy was</tspan>
      <tspan x="44" dy="21">recommended to be sure.</tspan>
    </text>
    <!-- source chip -->
    <rect x="44" y="432" width="248" height="26" rx="13" fill="#fbeae4" stroke="#f4c9bd"/>
    <text x="58" y="449" fill="#e8836b" font-size="12" font-weight="500">From your Right breast ultrasound · 2025-09-10</text>

    <!-- suggestions -->
    <rect x="24" y="500" width="342" height="46" rx="14" fill="#fffdfb" stroke="#ece2d8"/>
    <text x="44" y="528" fill="#5b4a5e" font-size="14.5">What do I do if I get a fever?</text>
    <rect x="24" y="556" width="342" height="46" rx="14" fill="#fffdfb" stroke="#ece2d8"/>
    <text x="44" y="584" fill="#5b4a5e" font-size="14.5">What are my next steps?</text>
    <rect x="24" y="612" width="342" height="46" rx="14" fill="#fffdfb" stroke="#ece2d8"/>
    <text x="44" y="640" fill="#5b4a5e" font-size="14.5">What does ER positive mean?</text>

    <!-- composer -->
    <rect x="0" y="708" width="390" height="60" fill="#faf6f1"/>
    <line x1="0" y1="708" x2="390" y2="708" stroke="#ece2d8"/>
    <rect x="16" y="720" width="300" height="46" rx="23" fill="#fffdfb" stroke="#ece2d8"/>
    <text x="34" y="748" fill="#8a7c8d" font-size="15">Ask about your care…</text>
    <circle cx="345" cy="743" r="23" fill="#e8836b"/>
    <text x="345" y="750" fill="#fff" font-size="18" text-anchor="middle">↑</text>

    <!-- Bottom tab bar -->
    <rect x="0" y="768" width="390" height="76" fill="#fffdfb"/>
    <line x1="0" y1="768" x2="390" y2="768" stroke="#ece2d8"/>
    <path d="M46 792 l16 -13 l16 13 v19 a1 1 0 0 1 -1 1 h-8 v-12 h-12 v12 h-8 a1 1 0 0 1 -1 -1 z" fill="none" stroke="#8a7c8d" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="62" y="828" fill="#8a7c8d" font-size="11" text-anchor="middle">Record</text>
    <rect x="188" y="782" width="12" height="18" rx="6" fill="none" stroke="#8a7c8d" stroke-width="1.8"/>
    <path d="M182 794 a12 12 0 0 0 24 0 M194 802 v6" stroke="#8a7c8d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="194" y="828" fill="#8a7c8d" font-size="11" text-anchor="middle">Capture</text>
    <!-- Ask (active) -->
    <path d="M312 784 h20 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-14 l-6 6 v-6 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4 z" fill="none" stroke="#2b1830" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="326" y="828" fill="#2b1830" font-size="11" font-weight="600" text-anchor="middle">Ask</text>
  </g>
  <rect x="0.5" y="0.5" width="389" height="843" rx="40" fill="none" stroke="#e6dccf"/>
</svg>
