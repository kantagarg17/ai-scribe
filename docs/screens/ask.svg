<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <clipPath id="fa"><rect x="0" y="0" width="390" height="844" rx="40"/></clipPath>
    <radialGradient id="send" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#efa88f"/><stop offset="1" stop-color="#d9765e"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#fa)">
    <rect width="390" height="844" fill="#f6f4ef"/>

    <!-- Header -->
    <text x="22" y="44" fill="#7fa68c" font-size="11.5" font-weight="600" letter-spacing="1.7">PERFECT MEMORY</text>
    <text x="22" y="76" fill="#2c2033" font-size="29" font-weight="600" font-family="Fraunces, Georgia, serif">Ask</text>

    <!-- user bubble -->
    <rect x="150" y="102" width="220" height="44" rx="20" fill="#3a2742"/>
    <text x="170" y="130" fill="#fff" font-size="15">Can you explain my ultrasound?</text>

    <!-- assistant bubble -->
    <rect x="20" y="162" width="350" height="286" rx="20" fill="#fffefb" stroke="#ece5db"/>
    <text x="40" y="192" fill="#2c2033" font-size="15">
      <tspan x="40" dy="0">From your ultrasound on September 10, it found a</tspan>
      <tspan x="40" dy="21">small, irregular-shaped area in your right breast</tspan>
      <tspan x="40" dy="21">that looked different from the rest of the tissue.</tspan>
      <tspan x="40" dy="21">It was about 1.8 cm and located near the top of</tspan>
      <tspan x="40" dy="21">the breast, about 4 cm from the nipple. The edges</tspan>
      <tspan x="40" dy="21">weren't clear, which can be a sign something</tspan>
      <tspan x="40" dy="21">might be wrong.</tspan>
      <tspan x="40" dy="28">It scored BI-RADS 4 — suspicious enough that a</tspan>
      <tspan x="40" dy="21">biopsy was recommended to be sure.</tspan>
    </text>
    <!-- source chip (sage) -->
    <rect x="40" y="410" width="252" height="26" rx="13" fill="#e6efe7" stroke="#cfe0d3"/>
    <text x="54" y="427" fill="#4e7d61" font-size="11.5" font-weight="500">From your Right breast ultrasound · 2025-09-10</text>

    <!-- suggestions with coral dots -->
    <rect x="20" y="478" width="350" height="46" rx="14" fill="#fffefb" stroke="#ece5db"/>
    <circle cx="42" cy="501" r="3" fill="#e8927c"/>
    <text x="56" y="506" fill="#6a5c6e" font-size="14.5">What do I do if I get a fever?</text>
    <rect x="20" y="534" width="350" height="46" rx="14" fill="#fffefb" stroke="#ece5db"/>
    <circle cx="42" cy="557" r="3" fill="#e8927c"/>
    <text x="56" y="562" fill="#6a5c6e" font-size="14.5">What are my next steps?</text>
    <rect x="20" y="590" width="350" height="46" rx="14" fill="#fffefb" stroke="#ece5db"/>
    <circle cx="42" cy="613" r="3" fill="#e8927c"/>
    <text x="56" y="618" fill="#6a5c6e" font-size="14.5">What does ER positive mean?</text>

    <!-- composer -->
    <rect x="0" y="708" width="390" height="68" fill="#f6f4ef"/>
    <line x1="0" y1="708" x2="390" y2="708" stroke="#ece5db"/>
    <rect x="16" y="720" width="300" height="46" rx="23" fill="#fffefb" stroke="#e2d9cd"/>
    <text x="34" y="748" fill="#9b8f9e" font-size="15">Ask about your care…</text>
    <circle cx="345" cy="743" r="23" fill="url(#send)"/>
    <text x="345" y="750" fill="#fff" font-size="18" text-anchor="middle">↑</text>

    <!-- Footer nav -->
    <rect x="0" y="776" width="390" height="68" fill="#fffefb"/>
    <line x1="0" y1="776" x2="390" y2="776" stroke="#ece5db"/>
    <path d="M50 802 l12 -10 l12 10 v13 a1 1 0 0 1 -1 1 h-6 v-9 h-10 v9 h-6 a1 1 0 0 1 -1 -1 z" fill="none" stroke="#9b8f9e" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="62" y="832" fill="#9b8f9e" font-size="11" text-anchor="middle">Record</text>
    <rect x="189" y="791" width="12" height="17" rx="6" fill="none" stroke="#9b8f9e" stroke-width="1.8"/>
    <path d="M183 802 a12 12 0 0 0 24 0 M195 810 v5" stroke="#9b8f9e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="195" y="832" fill="#9b8f9e" font-size="11" text-anchor="middle">Capture</text>
    <circle cx="326" cy="800" r="15" fill="#e6efe7"/>
    <path d="M314 792 h18 a4 4 0 0 1 4 4 v11 a4 4 0 0 1 -4 4 h-13 l-5 5 v-5 a4 4 0 0 1 -4 -4 v-11 a4 4 0 0 1 4 -4 z" fill="none" stroke="#3a2742" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="326" y="832" fill="#3a2742" font-size="11" font-weight="600" text-anchor="middle">Ask</text>
  </g>
  <rect x="0.5" y="0.5" width="389" height="843" rx="40" fill="none" stroke="#e2d9cd"/>
</svg>
