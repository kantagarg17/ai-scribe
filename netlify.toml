# Netlify configuration for AI-Scribe: static frontend + a serverless function
# that provides REAL AI via Groq (grounded chat, visit summaries, Whisper
# transcription). Frontend and API share one origin, so no CORS or API base URL
# is needed.
#
# base is the repo root so Netlify finds netlify/functions. The frontend is
# built with an explicit cd.

[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Live mode: the frontend calls the Netlify Function at /api on the same
  # origin (no VITE_DEMO, no VITE_API_BASE set).

# The function declares its own routes (/api/*, /health) via `config.path`.
# This redirect is the SPA fallback for everything else.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
